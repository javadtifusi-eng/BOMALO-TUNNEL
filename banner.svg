<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Bomalo Tunnel" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a2230"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </radialGradient>

    <linearGradient id="sweep" gradientUnits="objectBoundingBox" x1="-0.6" y1="0" x2="-0.25" y2="0">
      <stop offset="0" stop-color="#eef2f8"/>
      <stop offset="0.5" stop-color="#f7d894"/>
      <stop offset="1" stop-color="#eef2f8"/>
      <animate attributeName="x1" values="-0.6;1.0;-0.6" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.25;1.35;-0.25" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8102e" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#d99a3c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c8102e" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <text x="600" y="150" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="112" font-weight="700" letter-spacing="10" fill="url(#sweep)">BOMALO TUNNEL</text>

  <text x="600" y="196" text-anchor="middle"
        font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace"
        font-size="20" letter-spacing="6" fill="#7f8b9c">reverse tunnel &#183; client-initiated &#183; zero inbound ports</text>

  <!-- packet flow -->
  <g>
    <line x1="270" y1="266" x2="930" y2="266" stroke="url(#wire)" stroke-width="2"/>

    <circle cx="270" cy="266" r="9" fill="#0b0e14" stroke="#d99a3c" stroke-width="2.5"/>
    <circle cx="930" cy="266" r="9" fill="#0b0e14" stroke="#d99a3c" stroke-width="2.5"/>

    <text x="270" y="304" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace"
          font-size="15" letter-spacing="3" fill="#9aa6b8">IRAN</text>
    <text x="930" y="304" text-anchor="middle" font-family="'DejaVu Sans Mono', monospace"
          font-size="15" letter-spacing="3" fill="#9aa6b8">ABROAD</text>

    <circle r="5" cy="266" fill="#f7d894">
      <animate attributeName="cx" values="930;270" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="5" cy="266" fill="#f7d894">
      <animate attributeName="cx" values="930;270" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" cy="266" fill="#e06a7a">
      <animate attributeName="cx" values="270;930" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
