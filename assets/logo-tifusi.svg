<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="800" height="840" role="img" aria-label="Tifusi Tunnel">
  <defs>
    <radialGradient id="tt-glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#221b13"/>
      <stop offset="55%" stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </radialGradient>
    <radialGradient id="tt-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9FF3EC"/>
      <stop offset="100%" stop-color="#49C7BE"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="840" fill="url(#tt-glow)"/>

  <!-- tunnel: concentric rings receding to a lit core -->
  <g fill="none" stroke="#49C7BE">
    <circle cx="400" cy="372" r="98" stroke-width="2" stroke-opacity="0.5"/>
    <circle cx="400" cy="372" r="75" stroke-width="2.5" stroke-opacity="0.68"/>
    <circle cx="400" cy="372" r="52" stroke-width="3" stroke-opacity="0.85"/>
  </g>
  <circle cx="400" cy="372" r="29" fill="none" stroke="#F4EEE2" stroke-width="3.5"/>
  <circle cx="400" cy="372" r="7" fill="url(#tt-core)"/>

  <!-- shield -->
  <path d="M400 182 C470 182 528 201 561 234 C570 296 561 396 524 474 C495 537 448 582 400 614 C352 582 305 537 276 474 C239 396 230 296 239 234 C272 201 330 182 400 182 Z"
        fill="none" stroke="#F4EEE2" stroke-width="6" stroke-linejoin="round"/>

  <!-- right volute + feather sweep (Persepolis-capital-inspired scroll) -->
  <g stroke="#C9A063" stroke-width="4.5" fill="none" stroke-linecap="round">
    <path d="M460 216 C500 194 540 199 558 174 C572 154 566 126 542 116 C522 108 505 120 506 136 C507 146 516 152 526 148"/>
    <path d="M452 220 C500 234 545 246 578 262"/>
    <path d="M446 238 C492 256 533 274 562 296"/>
    <path d="M438 258 C480 280 516 302 540 328"/>
  </g>
  <!-- mirrored left volute + feather sweep -->
  <g stroke="#C9A063" stroke-width="4.5" fill="none" stroke-linecap="round" transform="translate(800,0) scale(-1,1)">
    <path d="M460 216 C500 194 540 199 558 174 C572 154 566 126 542 116 C522 108 505 120 506 136 C507 146 516 152 526 148"/>
    <path d="M452 220 C500 234 545 246 578 262"/>
    <path d="M446 238 C492 256 533 274 562 296"/>
    <path d="M438 258 C480 280 516 302 540 328"/>
  </g>

  <!-- wordmark -->
  <text x="400" y="678" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="64" letter-spacing="6" fill="#F4EEE2">TIFUSI TUNNEL</text>
  <text x="400" y="716" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="5" fill="#8D93A0">REVERSE TUNNEL &#183; CLIENT-INITIATED</text>
</svg>
